[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DEM-cookies"
version = "0"
description = "A small two-dimensional discrete element model"
authors = [{ name = "Bruno" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
dev = [
    "flake8>=7.0",
    "flake8-docstrings>=1.7",
    "mypy>=1.10",
    "yapf>=0.40",
]

[tool.setuptools]
packages = ["DEMcookies"]

[tool.yapf]
based_on_style = "pep8"
column_limit = 120

[tool.mypy]
python_version = "3.12"
files = ["DEMcookies", "tests", "examples", "main.py", "manual/scripts"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
